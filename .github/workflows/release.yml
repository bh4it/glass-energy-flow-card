name: Release

# Publishes a GitHub release whenever CARD_VERSION in the card changes, so HACS
# offers the update. Bumping the version in dist/glass-energy-flow-card.js is all
# a release needs.
on:
  push:
    branches: [main]
    paths: ["dist/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the card version
        id: version
        run: |
          v=$(sed -n 's/.*const CARD_VERSION = "\([0-9][0-9.]*\)".*/\1/p' dist/glass-energy-flow-card.js | head -1)
          if [ -z "$v" ]; then echo "CARD_VERSION not found"; exit 1; fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Create the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
